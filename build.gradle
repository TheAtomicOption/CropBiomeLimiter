plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.name}-${project.minecraft_version}"
}

repositories {
	// Loom adds the essential Maven repositories for Minecraft and Fabric automatically.
	maven { url = "https://maven.blamejared.com" }
	maven { url = "https://maven.shedaniel.me" }
}

def viewerTest = providers.gradleProperty("viewer_test").getOrElse("")
if (!viewerTest.isEmpty() && !["jei", "rei"].contains(viewerTest)) {
	throw new GradleException("viewer_test must be either 'jei' or 'rei'")
}

loom {
	mods {
		"cropbiomelimiter" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
	modCompileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
	modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	if (viewerTest == "jei") {
		modRuntimeOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	} else if (viewerTest == "rei") {
		modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
		modRuntimeOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
		modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
	from("config-app") {
		into "config-app"
		include "README.md"
		include "index.html"
		include "styles.css"
		include "app.js"
		include "Open Config App.cmd"
		include "Open Config App.sh"
		include "Open Config App.command"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('test') {
	enabled = false
}

tasks.register('runUnitTests', JavaExec) {
	group = 'verification'
	description = 'Runs dependency-free unit tests.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'rocks.theatomicoption.cropbiomelimiter.config.SmokeTestSuite'
}

check.dependsOn tasks.named('runUnitTests')

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add publishing repositories here when release automation is ready.
	}
}
